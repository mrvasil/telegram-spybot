services:
  spybot:
    build: .
    image: telegram-spybot:2.0.0
    restart: unless-stopped
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 90s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    env_file: .env
    environment:
      DATA_DIR: /data
      ARCHIVE_KEY_FILE: /run/spybot/archive.key
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${ARCHIVE_KEY_FILE:?Set the absolute path to your separate archive key}
        target: /run/spybot/archive.key
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
